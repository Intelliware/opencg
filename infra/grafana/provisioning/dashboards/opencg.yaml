# Dashboards as code: every JSON file in infra/grafana/dashboards/ is loaded
# into the "openCG" folder. Edits made in the Grafana UI are not saved back;
# change the JSON in the repository instead (see docs/OPERATIONS.md).
apiVersion: 1

providers:
  - name: opencg
    orgId: 1
    folder: openCG
    folderUid: opencg
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards/opencg
      foldersFromFilesStructure: false
