# Provisioned datasources for the opt-in observability overlay. The UIDs are
# fixed: every dashboard in infra/grafana/dashboards/ references a datasource
# only by one of these two UIDs (enforced by scripts/check-dashboards.py).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: opencg-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Tempo
    uid: opencg-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Trace → metrics: from a span, jump to the request and stage-latency
      # series of the service that emitted it.
      tracesToMetrics:
        datasourceUid: opencg-prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        tags:
          - key: service.name
            value: service
        queries:
          - name: Request rate
            query: sum by (tool, outcome) (rate(opencg_requests_total[5m]))
          - name: Stage latency p95
            query: histogram_quantile(0.95, sum by (le, stage) (rate(opencg_stage_latency_seconds_bucket[5m])))
      search:
        hide: false
      nodeGraph:
        enabled: true
      # No serviceMap: Tempo's metrics-generator (service graphs) is out of
      # scope for this overlay.
