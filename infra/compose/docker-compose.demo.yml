# Demo overlay (add-showcase-seed-packs). Applied by `make demo-up`, `make demo-seed`,
# `make demo-reset` and `make demo-smoke` (see demo/scripts/common.sh), never by
# `make up-d`:
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.oidc.yml \
#                  -f infra/compose/docker-compose.demo.yml \
#                  --profile dev --profile idp ...
#
# Mounts the synthetic packs read-only into ingestion; demo/scripts/seed.sh copies
# each folder to /tmp/opencg-demo-<pack>-<class>, commits it and ingests it with
# the CLI, so local paths under /tmp must be allowed.
#
# demo/.api-keys.json (gitignored; `make demo-up` creates it as `[]`) holds the
# SHA-256 of each per-persona dev API key that `DEMO_API_KEYS=1 make demo-seed`
# creates, for tools that can't sign in with OAuth. API keys work only in dev.
services:
  ingestion:
    environment:
      OPENCG__INGESTION__GIT__LOCAL_ROOTS: /tmp
    volumes:
      - ../../demo/packs:/opt/opencg/demo-packs:ro

  pipeline:
    environment:
      OPENCG__AUTH__API_KEYS_FILE: /opt/opencg/demo-api-keys.json
    volumes:
      - ../../demo/.api-keys.json:/opt/opencg/demo-api-keys.json:ro

  mcp-server:
    environment:
      OPENCG__AUTH__API_KEYS_FILE: /opt/opencg/demo-api-keys.json
    volumes:
      - ../../demo/.api-keys.json:/opt/opencg/demo-api-keys.json:ro
