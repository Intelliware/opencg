# Admin UI e2e overlay, applied on top of the smoke overlay by `make e2e`:
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.smoke.yml \
#                  -f infra/compose/docker-compose.e2e.yml --profile dev ...
#
# Not part of the smoke overlay, because `make smoke-cloud` needs ingestion's
# real chat provider.
services:
  ingestion:
    environment:
      # "Run now" from the UI ingests with the service's own settings; keep
      # extraction on the deterministic stub so the suite never calls a provider.
      OPENCG__PROVIDERS__CHAT__BASE_URL: http://smoke-chat:11434
      OPENCG__PROVIDERS__CHAT__PROVIDER: ollama
      OPENCG__PROVIDERS__CHAT__MODEL: smoke-chat
      OPENCG__PROVIDERS__CHAT__API_KEY: ""
