# Test auth overlay for `oidc` mode (add-identity-and-opa, design D13). Applied
# with the smoke overlay by tests/smoke/lib.sh when OPENCG_TEST_AUTH_MODE=oidc
# (the default), so `make smoke`, `make smoke-obs` and `make e2e` run the real
# OIDC + OPA path against the bundled Keycloak, whatever .env says:
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.smoke.yml \
#                  -f infra/compose/docker-compose.oidc.yml \
#                  --profile dev --profile idp ...
#
# Every openCG service gets the same mode, issuer and internal URL, so they
# cannot disagree. Tokens carry the public issuer (Keycloak's KC_HOSTNAME);
# containers reach Keycloak at the internal URL. Never part of `make up-d`.
x-opencg-oidc-env: &opencg-oidc-env
  OPENCG__AUTH__MODE: oidc
  OPENCG__AUTH__OIDC__ISSUER: ${OPENCG__KEYCLOAK__PUBLIC_URL:-http://localhost:${OPENCG__KEYCLOAK__HOST_PORT:-8380}}/realms/opencg
  OPENCG__AUTH__OIDC__INTERNAL_URL: http://keycloak:8080/realms/opencg

x-needs-keycloak: &needs-keycloak
  keycloak: { condition: service_healthy }

services:
  pipeline:
    environment: *opencg-oidc-env
    depends_on: *needs-keycloak

  ingestion:
    environment: *opencg-oidc-env
    depends_on: *needs-keycloak

  mcp-server:
    environment: *opencg-oidc-env
    depends_on: *needs-keycloak

  admin-ui:
    environment: *opencg-oidc-env
    depends_on: *needs-keycloak
