# Tempo 3.1 in monolithic mode (`-target=all`, the default) for the opt-in
# observability overlay (infra/compose/docker-compose.observability.yml).
# Written against the Tempo 3.1 configuration reference and the upstream
# example/docker-compose/single-binary example at v3.1.1. Tempo 3 has no
# `ingester:` or `compactor:` blocks: in monolithic mode the distributor
# pushes in-process to the live-store, and the backend scheduler and worker
# run in-process for compaction and retention. No Kafka is needed.

server:
  # Query API; the only port published to the host.
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        # The collector exports here (compose-internal only, never published).
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Block retention: 48 h (design D8). The compaction block is read by both the
# scheduler (which plans retention and compaction jobs) and the worker.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 48h

backend_worker:
  compaction:
    block_retention: 48h

usage_report:
  reporting_enabled: false
