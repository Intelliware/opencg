[project]
name = "opencg-context-fabric"
version = "0.0.0"
description = "Open-source, self-hostable enterprise context engineering, exposed as MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[dependency-groups]
# Installed by a plain `uv sync` (uv's default group); excluded from service
# images, which use `uv sync --no-dev`.
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8,<0.9",
]

[tool.uv.workspace]
members = [
  "packages/shared-py",
  "services/pipeline",
  "services/ingestion",
]

[tool.uv.sources]
opencg-shared = { workspace = true }
opencg-pipeline = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "volumes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "TID", "PLE", "PLW"]
ignore = ["E501"]   # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["services", "packages"]
addopts = "-ra -q"
