# openCG — single-tenant deployment configuration.
# Environment variables override values here using the convention
#   OPENCG__<SECTION>__<KEY> = value
# (double underscore separates nesting levels).
tenant: default

# Auth is configured through the environment, not this file (see .env.example):
#   OPENCG__ENVIRONMENT (dev|test|staging|production; unset = production),
#   OPENCG__AUTH__MODE (none|oidc), OPENCG__AUTH__OIDC__* (issuer, internal URL,
#   audience, claim paths), OPENCG__AUTH__API_KEYS_FILE (dev only),
#   OPENCG__OPA__URL / OPENCG__OPA__TIMEOUT_MS (policy decisions, both modes).
identity:
  # Stub identity, used only in `none` auth mode (and as the actor there).
  principal: local-dev
  roles: [admin, reader]

postgres:
  url: postgresql://opencg:opencg@postgres:5432/opencg

qdrant:
  url: http://qdrant:6333
  collection_prefix: "default__"
  vector_size: 768   # nomic-embed-text
  distance: cosine

valkey:
  url: redis://valkey:6379/0

ollama:
  # Default targets the compose `ollama` service. `http://host.docker.internal:11434`
  # works when bridging to a host install; `https://ollama.com` works for the
  # Cloud's chat endpoints but NOT embeddings on the reference account
  # (see openspec/changes/archive/2026-11-10-bootstrap-thin-mvp/design.md D1).
  base_url: http://ollama:11434
  # Swapping the embedding model? Match `qdrant.vector_size` to the model's
  # output dim or recreate the Qdrant collection — see docs/OPERATIONS.md.
  embedding_model: nomic-embed-text
  # api_key is NEVER hardcoded here. Set OPENCG__OLLAMA__API_KEY in .env
  # or your secret store. The request adds `Authorization: Bearer <key>` when
  # the key is non-empty; local Ollama servers ignore it.
  api_key: null

providers:
  # New deployments use the compose-local Ollama instance for embeddings.
  # The legacy `ollama` block remains the backwards-compatible source when
  # this block is omitted.
  embeddings:
    provider: ollama
    base_url: http://ollama:11434
    model: nomic-embed-text
    api_key: null
  # Chat is independently configurable and defaults to Ollama Cloud. Supply
  # the key through OPENCG__PROVIDERS__CHAT__API_KEY.
  chat:
    # `provider` is the label for metrics and pricing. Ollama Cloud is
    # `ollama-cloud`; it uses the same Ollama adapter as local `ollama`.
    provider: ollama-cloud
    base_url: https://ollama.com
    model: gemma4:31b
    api_key: null
  extraction:
    enabled: true
    min_confidence: 0.6
    timeout_seconds: 30
    chat_qps: null

retrieval:
  default_top_k: 20
  default_token_budget: 4000
  # Approx tokens-per-char fallback when a real tokenizer is unavailable.
  tokens_per_char: 0.25

audit:
  # Retention in days. 0 disables pruning.
  retention_days: 90

observability:
  # Cost estimation. USD per 1,000 tokens, keyed by the endpoint's `provider`
  # label and model. A (provider, model) pair with no row is still counted —
  # in opencg_cost_unpriced_tokens_total — and shown as "unpriced", never $0.
  # Every row needs `source` and `as_of` so readers can tell where a price
  # came from and how old it is. See docs/OPERATIONS.md "Pricing" to refresh.
  pricing:
    - provider: ollama
      model: nomic-embed-text
      input_usd_per_1k: 0
      output_usd_per_1k: 0
      source: compose-local Ollama container; no per-token charge
      as_of: 2026-11-12
    # Ollama Cloud publishes per-token rates (USD per million; divided by 1,000
    # here). Standard (peak) input and output rates; cached-input and off-peak
    # discounts are not modelled. The price list names Gemma 4 `gemma4`; Ollama
    # Cloud serves it as `gemma4:31b` (the default chat model), so both names
    # are priced at the same published rate.
    - provider: ollama-cloud
      model: "beam"
      input_usd_per_1k: 0.000125
      output_usd_per_1k: 0.0004
      source: https://ollama.com/pricing
      as_of: 2026-11-12
    - provider: ollama-cloud
      model: "deepseek-v4.1-flash"
