[project]
name = "opencg-ingestion"
version = "0.0.0"
description = "openCG ingestion connectors (thin MVP: git only)."
requires-python = ">=3.12"
dependencies = [
  "opencg-shared",
  # graph_writer / pipeline_runner import opencg_pipeline (catalog, AGE, extractor).
  "opencg-pipeline",
  "asyncpg>=0.30",
  "qdrant-client>=1.12,<1.13",
  "httpx>=0.27",
  "click>=8.1",
  # Code-side ingestion: graphifyy provides language-aware file discovery
  # (collect_files) + tree-sitter symbol extraction (extract). See
  # openspec/changes/adopt-graphifyy/ for the contract.
  "graphifyy>=0.8,<0.9",
]

[project.scripts]
opencg-ingest = "opencg_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencg_ingestion"]
