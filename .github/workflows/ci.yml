name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # nightly full-stack run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.3 # no moving major tag upstream
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies from the lockfiles
        run: |
          pnpm install --frozen-lockfile
          uv sync --all-packages --frozen

      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make opa-test # Rego tests + policy revision check, via the pinned OPA image
      - run: make storybook
      - run: make check-agent-guides
      - run: make check-dashboards
      - run: make openspec-validate
      - run: make secrets-scan

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  stack:
    name: stack
    needs: static
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_CACHE_DIR: /tmp/ollama-models # outside the repo, so not in any build context
      # Smoke and e2e run the real OIDC + OPA path against the bundled Keycloak
      # (tests/smoke/lib.sh adds docker-compose.oidc.yml and the `idp` profile).
      OPENCG_TEST_AUTH_MODE: oidc
      IDP_IMAGES_TAR: /tmp/idp-images/images.tar
      COMPOSE_TEST: >-
        docker compose -f infra/compose/docker-compose.yml
        -f infra/compose/docker-compose.smoke.yml -f infra/compose/docker-compose.oidc.yml
        -f infra/compose/docker-compose.e2e.yml --env-file .env --profile dev --profile idp
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Playwright browser cache key
        id: playwright
        run: echo "version=$(pnpm --filter @opencg/admin-ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @opencg/admin-ui exec playwright install chromium
      # The runner image usually has every library Chromium needs; apt (and the
      # Ubuntu mirrors, which have failed to resolve on runners) is a fallback.
      - name: Install Chromium system dependencies if it can't start
        working-directory: services/admin-ui
        run: |
          if node -e "require('@playwright/test').chromium.launch().then((b) => b.close())"; then
            echo "Chromium starts with the runner's libraries; skipping install-deps"
            exit 0
          fi
          for attempt in 1 2 3; do
            pnpm exec playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt of 3); retrying in 30 s"
            sleep 30
          done
          exit 1

      - name: Create .env from the example
        run: cp .env.example .env

      - uses: docker/setup-buildx-action@v4
      - name: Build images (layer cache per image)
        uses: docker/bake-action@v7
        with:
          # Bake resolves env_file and build contexts from its working directory,
          # so run it where the compose file's ../../ paths make sense.
          source: ./infra/compose
          files: docker-compose.yml
          allow: fs.read=../..
          targets: postgres,pipeline,ingestion,mcp-server,admin-ui
          load: true
          set: |
            postgres.cache-from=type=gha,scope=postgres
            postgres.cache-to=type=gha,scope=postgres,mode=max
            pipeline.cache-from=type=gha,scope=pipeline
            pipeline.cache-to=type=gha,scope=pipeline,mode=max
            ingestion.cache-from=type=gha,scope=ingestion
            ingestion.cache-to=type=gha,scope=ingestion,mode=max
            mcp-server.cache-from=type=gha,scope=mcp-server
            mcp-server.cache-to=type=gha,scope=mcp-server,mode=max
            admin-ui.cache-from=type=gha,scope=admin-ui
            admin-ui.cache-to=type=gha,scope=admin-ui,mode=max

      # Only models/ is cached: /root/.ollama also holds the instance's identity key.
      - name: Ollama model cache key
        id: ollama
        run: |
          model="$(sed -n 's/^OPENCG__OLLAMA__EMBEDDING_MODEL=//p' .env.example)"
          tag="$(sed -n 's|.*image: ollama/ollama:||p' infra/compose/docker-compose.yml)"
          echo "key=ollama-models-${model}-${tag}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: ollama-cache
        with:
          path: ${{ env.OLLAMA_CACHE_DIR }}
          key: ${{ steps.ollama.outputs.key }}
      - name: Seed the Ollama volume from the cache
        if: steps.ollama-cache.outputs.cache-hit == 'true'
        run: |
          docker volume create \
            --label com.docker.compose.project=opencg \
            --label com.docker.compose.volume=ollama-data \
            opencg_ollama-data
          docker run --rm -v opencg_ollama-data:/root/.ollama -v "$OLLAMA_CACHE_DIR:/cache:ro" \
            alpine:3 sh -c 'mkdir -p /root/.ollama/models && cp -a /cache/. /root/.ollama/models/'

      # The pulled Keycloak and OPA images, saved as one tarball keyed by their
      # pinned tags (compose has no layer cache for pulled images).
      - name: Keycloak and OPA image cache key
        id: idp-images
        run: |
          images="$(sed -n -e 's|^ *image: \(quay.io/keycloak/keycloak:.*\)$|\1|p' \
            -e 's|^ *image: \(openpolicyagent/opa:.*\)$|\1|p' infra/compose/docker-compose.yml | sort -u | xargs)"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "key=idp-images-$(echo "$images" | tr ' /:' '-__')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: idp-images-cache
        with:
          path: /tmp/idp-images
          key: ${{ steps.idp-images.outputs.key }}
      - name: Load the Keycloak and OPA images (pull and save on a cache miss)
        env:
          IMAGES: ${{ steps.idp-images.outputs.images }}
        run: |
          if [ -f "$IDP_IMAGES_TAR" ]; then
            docker load -i "$IDP_IMAGES_TAR"
            exit 0
          fi
          for image in $IMAGES; do
            for attempt in 1 2 3; do
              docker pull --quiet "$image" && break
              [ "$attempt" = 3 ] && exit 1
              echo "pull of $image failed (attempt $attempt of 3); retrying in 15 s"
              sleep 15
            done
          done
          mkdir -p "$(dirname "$IDP_IMAGES_TAR")"
          # shellcheck disable=SC2086 # one argument per image
          docker save -o "$IDP_IMAGES_TAR" $IMAGES

      - name: Start the stack and wait for health
        run: |
          make up-d
          docker compose -f infra/compose/docker-compose.yml --env-file .env --profile dev \
            up -d --wait --wait-timeout 900

      - name: Save the Ollama models to the cache
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$OLLAMA_CACHE_DIR"
          docker run --rm -v opencg_ollama-data:/root/.ollama:ro -v "$OLLAMA_CACHE_DIR:/cache" \
            alpine:3 sh -c 'cp -a /root/.ollama/models/. /cache/ && chmod -R a+rX /cache'
      - uses: actions/cache/save@v6
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.OLLAMA_CACHE_DIR }}
          key: ${{ steps.ollama.outputs.key }}

      - uses: actions/cache/save@v6
        if: steps.idp-images-cache.outputs.cache-hit != 'true'
        with:
          path: /tmp/idp-images
          key: ${{ steps.idp-images.outputs.key }}

      - run: make smoke
      - run: make e2e
      # Nightly regression guard for issue #2 (upgrade-admin-ui-next-16, D3):
      # a smaller hydration stress pass against the seeded production build.
      - name: Hydration stress (nightly)
        if: github.event_name == 'schedule'
        env:
          SUMMARY_FILE: ${{ github.workspace }}/hydration-stress.json
        run: make hydration-stress BROWSERS=4 CYCLES=10
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'schedule'
        with:
          name: hydration-stress-summary
          path: hydration-stress.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Collect compose logs
        if: failure()
        run: |
          $COMPOSE_TEST logs --no-color --timestamps > compose-logs.txt 2>&1 || true
          $COMPOSE_TEST ps -a >> compose-logs.txt 2>&1 || true
          $COMPOSE_TEST logs --no-color --timestamps opa > opa-logs.txt 2>&1 || true
          $COMPOSE_TEST logs --no-color --timestamps keycloak > keycloak-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: stack-failure-evidence
          path: |
            compose-logs.txt
            opa-logs.txt
            keycloak-logs.txt
            services/admin-ui/playwright-report/
            services/admin-ui/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # The OPTIONAL observability overlay (Prometheus, Tempo, Grafana), checked by
  # `make smoke-obs`. A required check: it runs on every PR to main, on pushes
  # to main and nightly, with NO path filter (a required check that a path
  # filter skips never reports, and the PR stays blocked). It runs in parallel
  # with `stack`, which never applies the overlay, so `stack` keeps its time.
  observability:
    name: observability
    needs: static
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OLLAMA_CACHE_DIR: /tmp/ollama-models
      # The smoke runs the real OIDC + OPA path here too (bundled Keycloak).
      OPENCG_TEST_AUTH_MODE: oidc
      IDP_IMAGES_TAR: /tmp/idp-images/images.tar
      COMPOSE_OBS: >-
        docker compose -f infra/compose/docker-compose.yml
        -f infra/compose/docker-compose.observability.yml --env-file .env --profile dev
      COMPOSE_OBS_TEST: >-
        docker compose -f infra/compose/docker-compose.yml
        -f infra/compose/docker-compose.smoke.yml -f infra/compose/docker-compose.oidc.yml
        -f infra/compose/docker-compose.observability.yml --env-file .env --profile dev --profile idp
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        run: cp .env.example .env

      - uses: docker/setup-buildx-action@v4
      - name: Build images (layer cache per image, shared with the stack job)
        uses: docker/bake-action@v7
        with:
          source: ./infra/compose
          files: docker-compose.yml
          allow: fs.read=../..
          targets: postgres,pipeline,ingestion,mcp-server,admin-ui
          load: true
          set: |
            postgres.cache-from=type=gha,scope=postgres
            pipeline.cache-from=type=gha,scope=pipeline
            ingestion.cache-from=type=gha,scope=ingestion
            mcp-server.cache-from=type=gha,scope=mcp-server
            admin-ui.cache-from=type=gha,scope=admin-ui

      # Read-only use of the stack job's Ollama model cache (that job saves it).
      - name: Ollama model cache key
        id: ollama
        run: |
          model="$(sed -n 's/^OPENCG__OLLAMA__EMBEDDING_MODEL=//p' .env.example)"
          tag="$(sed -n 's|.*image: ollama/ollama:||p' infra/compose/docker-compose.yml)"
          echo "key=ollama-models-${model}-${tag}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: ollama-cache
        with:
          path: ${{ env.OLLAMA_CACHE_DIR }}
          key: ${{ steps.ollama.outputs.key }}
      - name: Seed the Ollama volume from the cache
        if: steps.ollama-cache.outputs.cache-hit == 'true'
        run: |
          docker volume create \
            --label com.docker.compose.project=opencg \
            --label com.docker.compose.volume=ollama-data \
            opencg_ollama-data
          docker run --rm -v opencg_ollama-data:/root/.ollama -v "$OLLAMA_CACHE_DIR:/cache:ro" \
            alpine:3 sh -c 'mkdir -p /root/.ollama/models && cp -a /cache/. /root/.ollama/models/'

      # Read-only use of the stack job's Keycloak + OPA image cache (that job saves it).
      - name: Keycloak and OPA image cache key
        id: idp-images
        run: |
          images="$(sed -n -e 's|^ *image: \(quay.io/keycloak/keycloak:.*\)$|\1|p' \
            -e 's|^ *image: \(openpolicyagent/opa:.*\)$|\1|p' infra/compose/docker-compose.yml | sort -u | xargs)"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "key=idp-images-$(echo "$images" | tr ' /:' '-__')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: /tmp/idp-images
          key: ${{ steps.idp-images.outputs.key }}
      - name: Load the Keycloak and OPA images (pull on a cache miss)
        env:
          IMAGES: ${{ steps.idp-images.outputs.images }}
        run: |
          if [ -f "$IDP_IMAGES_TAR" ]; then
            docker load -i "$IDP_IMAGES_TAR"
            exit 0
          fi
          for image in $IMAGES; do
            for attempt in 1 2 3; do
              docker pull --quiet "$image" && break
              [ "$attempt" = 3 ] && exit 1
              echo "pull of $image failed (attempt $attempt of 3); retrying in 15 s"
              sleep 15
            done
          done

      - name: Pull the observability images (with retries)
        run: |
          for attempt in 1 2 3; do
            $COMPOSE_OBS pull --quiet prometheus tempo grafana otel-collector && exit 0
            echo "pull failed (attempt $attempt of 3); retrying in 15 s"
            sleep 15
          done
          exit 1

      - name: Start the stack with the observability overlay and wait for health
        run: $COMPOSE_OBS up -d --wait --wait-timeout 900

      - run: make smoke-obs

      - name: Collect compose logs and Prometheus target state
        if: failure()
        run: |
          $COMPOSE_OBS_TEST logs --no-color --timestamps > compose-logs.txt 2>&1 || true
          $COMPOSE_OBS_TEST ps -a >> compose-logs.txt 2>&1 || true
          $COMPOSE_OBS_TEST logs --no-color --timestamps opa > opa-logs.txt 2>&1 || true
          $COMPOSE_OBS_TEST logs --no-color --timestamps keycloak > keycloak-logs.txt 2>&1 || true
          curl -fsS http://localhost:9090/api/v1/targets > prometheus-targets.json 2>&1 || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: observability-failure-evidence
          path: |
            compose-logs.txt
            opa-logs.txt
            keycloak-logs.txt
            prometheus-targets.json
          retention-days: 14
          if-no-files-found: ignore
